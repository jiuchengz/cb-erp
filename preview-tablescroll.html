<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表格滚动条固定预览（发货模块示例）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f2f4f8; color: #333; }
  .layout { display: flex; height: 100%; gap: 18px; padding: 18px; }
  .sidebar { width: 210px; flex-shrink: 0; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 18px 14px; }
  .sidebar .brand { font-weight: 700; font-size: 16px; margin-bottom: 18px; }
  .sidebar .menu { padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; font-size: 14px; color: #555; }
  .sidebar .menu.active { background: #eef4ff; color: #2563eb; font-weight: 600; }
  .main { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: hidden; }
  .topbar { height: 52px; flex-shrink: 0; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .page { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 16px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
  .page-header h2 { font-size: 18px; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 6px; border: 1px solid #d9d9d9; background: #fff; font-size: 13px; cursor: pointer; margin-left: 6px; }
  .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .filters { display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; align-items: center; }
  .filters select, .filters input { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; background: #fff; }
  /* ===== 核心：表格固定高度区域，滚动条固定在底部 ===== */
  .table-wrap { flex: 1; min-height: 0; display: flex; border: 1px solid #ebeef5; border-radius: 8px; overflow: hidden; }
  .table-wrap .el-table { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .el-table__header-wrapper { flex-shrink: 0; overflow: hidden; }
  .el-table__body-wrapper { flex: 1; min-height: 0; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #ebeef5; padding: 8px 12px; text-align: left; white-space: nowrap; }
  th { background: #f5f7fa; color: #606266; font-weight: 600; position: sticky; top: 0; z-index: 2; }
  td { color: #606266; }
  /* 操作列固定右侧 */
  .fixed-right { position: sticky; right: 0; background: #fff; box-shadow: -4px 0 8px rgba(0,0,0,.04); z-index: 1; }
  thead .fixed-right { background: #f5f7fa; z-index: 3; }
  .pagination { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 12px; font-size: 13px; color: #606266; }
  .pagination .page-num { padding: 4px 10px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; }
  .pagination .page-num.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .hint { flex-shrink: 0; background: #fff7e6; border: 1px solid #ffe58f; color: #ad6800; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  /* 表格内部横向滚动：滚动条在表格 body 底部，固定不随行移动 */
  .el-table__body-wrapper table { min-width: 2400px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">跨境电商 ERP（预览）</div>
    <div class="menu">首页</div>
    <div class="menu active">发货管理</div>
    <div class="menu">商品</div>
    <div class="menu">销售</div>
    <div class="menu">售后 / 库存 / 采购 / 补货 / 调拨 / 用户</div>
  </aside>
  <div class="main">
    <div class="topbar"><span>发货管理</span><span>示例用户</span></div>
    <div class="page">
      <div class="page-header">
        <h2>发货管理</h2>
        <div>
          <span class="btn">导出</span>
          <span class="btn">导入模板</span>
          <span class="btn">批量导入</span>
          <span class="btn">货代管理</span>
          <span class="btn primary">新增发货单</span>
        </div>
      </div>
      <div class="filters">
        <select><option>状态：全部</option><option>已发货</option><option>运输中</option></select>
        <select><option>账单核对：全部</option><option>已核对</option><option>未核对</option></select>
        <span class="btn primary">查询</span>
      </div>
      <div class="hint">预览目标：表格区域高度固定，横向滚动条（底部滑块）固定在表格底部，不会随行数据上下移动；表格内部可独立横纵向滚动。</div>
      <div class="table-wrap">
        <div class="el-table">
          <div class="el-table__header-wrapper">
            <table>
              <thead>
                <tr id="headRow"></tr>
              </thead>
            </table>
          </div>
          <div class="el-table__body-wrapper" id="bodyWrap">
            <table>
              <tbody id="bodyRows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="pagination">
        <span>共 386 条</span>
        <span class="page-num active">1</span><span class="page-num">2</span><span class="page-num">3</span><span class="page-num">…</span><span class="page-num">20</span>
      </div>
    </div>
  </div>
</div>
<script>
  var cols = ["发货时间","货代","空海运","仓号","发货箱数","发货数量","货件号","货代号","目的国","物流单号","包裹数","实际重量kg","材积重kg","运费","账单核对","状态","备注","SKU","产品名称","平台","链接ID","操作"];
  var head = document.getElementById("headRow");
  cols.forEach(function(c, i) {
    var th = document.createElement("th");
    th.textContent = c;
    if (c === "操作") th.className = "fixed-right";
    if (c === "产品名称") th.style.minWidth = "170px";
    head.appendChild(th);
  });
  var tbody = document.getElementById("bodyRows");
  for (var i = 1; i <= 86; i++) {
    var tr = document.createElement("tr");
    cols.forEach(function(c, j) {
      var td = document.createElement("td");
      if (c === "操作") { td.className = "fixed-right"; td.innerHTML = '<a href="javascript:;" style="color:#2563eb;margin-right:8px;">编辑</a><a href="javascript:;" style="color:#f56c6c;">删除</a>'; }
      else if (c === "发货时间") td.textContent = "2026-08-" + String((i % 28) + 1).padStart(2, "0") + " 10:" + String((i * 7) % 60).padStart(2, "0");
      else if (c === "货代") td.textContent = ["极兔","云途","燕文","顺丰国际"][i % 4];
      else if (c === "空海运") td.textContent = i % 2 ? "空运" : "海运";
      else if (c === "仓号") td.textContent = "MX-" + (100 + i);
      else if (c === "发货箱数") td.textContent = (i % 9) + 1;
      else if (c === "发货数量") td.textContent = (i % 80) + 20;
      else if (c === "货件号") td.textContent = "SHIP202608" + String(1000 + i);
      else if (c === "货代号") td.textContent = "PD" + (2000 + i * 13);
      else if (c === "目的国") td.textContent = "墨西哥";
      else if (c === "物流单号") td.textContent = "LP" + String(9000000000 + i * 77);
      else if (c === "包裹数") td.textContent = i % 5 + 1;
      else if (c === "实际重量kg") td.textContent = (i % 40) + "." + (i % 9);
      else if (c === "材积重kg") td.textContent = (i % 50) + "." + (i % 7);
      else if (c === "运费") td.textContent = "¥" + (i * 13 % 200 + 50);
      else if (c === "账单核对") td.textContent = i % 3 ? "已核对" : "未核对";
      else if (c === "状态") td.textContent = i % 4 ? "运输中" : "已签收";
      else if (c === "备注") td.textContent = i % 6 ? "-" : "加急";
      else if (c === "SKU") td.textContent = "SKU-MX-" + (i * 17 % 999);
      else if (c === "产品名称") td.textContent = "跨境商品演示款" + (i % 30) + "号（MercadoLibre 墨西哥站热销款）";
      else if (c === "平台") td.textContent = "MercadoLibre";
      else if (c === "链接ID") td.textContent = "MLM" + (100000 + i * 3);
      else td.textContent = "-";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  // 左右滚动联动表头
  var bodyWrap = document.getElementById("bodyWrap");
  bodyWrap.addEventListener("scroll", function() {
    var headTable = document.querySelector(".el-table__header-wrapper table");
    headTable.style.transform = "translateX(-" + bodyWrap.scrollLeft + "px)";
  });
</script>
</body>
</html>
