<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>售后新增 - 产品全量加载修复预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background: #f5f7fa; padding: 24px; }
  .page { background: #fff; border-radius: 8px; padding: 20px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .page-header h2 { font-size: 18px; color: #303133; }
  .btns button { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; color: #606266; cursor: pointer; margin-left: 8px; font-size: 13px; }
  .btns button.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .note { margin-top: 16px; padding: 12px 16px; background: #f4f4f5; border-radius: 4px; color: #909399; font-size: 13px; line-height: 1.9; }
  .note b { color: #606266; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 8px; width: 640px; max-width: 94%; padding: 20px 24px; }
  .modal h3 { font-size: 16px; color: #303133; margin-bottom: 16px; }
  .item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .item-row input { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; width: 220px; font-size: 13px; }
  .item-name { color: #67c23a; font-size: 13px; }
  .item-row img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .modal-footer button { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; cursor: pointer; font-size: 13px; }
  .modal-footer button.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .warn { color: #e6a23c; font-size: 13px; }
  .ok { color: #67c23a; font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h2>售后管理</h2>
    <div class="btns"><button class="primary" onclick="openAdd()">新增售后单</button></div>
  </div>
  <div class="note">
    <b>本次修复说明</b><br>
    1. 根因：售后新增弹窗原本只加载前 200 条产品（后端 pageSize 硬上限 200），当产品总数超过 200 条时，第 201 条及之后的产品不会被加载，按链ID查询自然匹配不到——即使商品管理里能看到该产品。<br>
    2. 修复：改为<b>循环翻页拉取全部产品</b>（每页 200，直到取完 total），确保任意产品都能按链ID匹配到。<br>
    3. 仅前端改动，无后端接口变更。
  </div>
</div>

<div class="modal-mask" id="addModal">
  <div class="modal">
    <h3>新增售后单</h3>
    <div class="item-row">
      <input id="linkInput" placeholder="输入链ID" oninput="resolve()">
      <span id="resolveTip" class="warn">请输入链ID</span>
    </div>
    <div class="item-row" id="productInfo" style="display:none">
      <img id="pImg" src="" alt="">
      <span class="item-name" id="pName"></span>
    </div>
    <div class="modal-footer">
      <button onclick="closeAdd()">取消</button>
      <button class="primary" onclick="closeAdd()">保存</button>
    </div>
  </div>
</div>

<script>
// 模拟全量产品库（含第 201 条之后的产品）
const ALL_PRODUCTS = [
  ...Array.from({length: 200}, (_, i) => ({ id: 'p'+i, link_id: '100000'+i, name: '产品'+i, image_text: '' })),
  { id: 'p200', link_id: '4272847734', name: '涡轮增压器夹具 雪佛兰Cruze Trax 1.4 Turbo', image_text: '' },
  { id: 'p201', link_id: '4272849999', name: '汽车空调压缩机 丰田卡罗拉', image_text: '' },
]
function openAdd() { document.getElementById('addModal').classList.add('show') }
function closeAdd() { document.getElementById('addModal').classList.remove('show') }
function resolve() {
  const linkId = document.getElementById('linkInput').value.trim()
  const tip = document.getElementById('resolveTip')
  const info = document.getElementById('productInfo')
  if (!linkId) { tip.className = 'warn'; tip.textContent = '请输入链ID'; info.style.display = 'none'; return }
  const p = ALL_PRODUCTS.find((x) => x.link_id === linkId)
  if (p) {
    tip.className = 'ok'; tip.textContent = '已匹配'
    document.getElementById('pName').textContent = p.name
    info.style.display = 'flex'
  } else {
    tip.className = 'warn'; tip.textContent = '未找到链ID：' + linkId
    info.style.display = 'none'
  }
}
</script>
</body>
</html>
