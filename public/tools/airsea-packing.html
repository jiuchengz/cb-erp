<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>空海运 &amp; 装箱单 计算工具</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">

<!-- Libraries（CDN 仅用于加载代码，业务数据全程不离开当前页面） -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
:root{
  /* 对齐 ERP 液态玻璃主题（style.css）亮色 */
  --bg-c1:#7dd3fc; --bg-c2:#c4b5fd; --bg-c3:#f9a8d4; --bg-c4:#fde68a;
  --bg-angle:135deg; --glow-c1:#f472b6; --glow-c2:#60a5fa; --glow-opacity:0.55;
  --panel:rgba(255,255,255,0.42); --card:rgba(255,255,255,0.5);
  --glass-border:rgba(255,255,255,0.7); --line:rgba(20,24,40,0.12);
  --accent:#3b82f6; --accent2:#8b5cf6; --muted:rgba(20,24,40,0.6);
  --text:rgba(20,24,40,0.92); --input-bg:rgba(255,255,255,0.65);
  --table-bg:rgba(255,255,255,0.55); --success:#16a34a; --danger:#e74c3c;
  --shadow:0 20px 50px rgba(40,60,120,0.18);
}
html.dark{
  --bg-c1:#1e293b; --bg-c2:#312e50; --bg-c3:#3b2f4e; --bg-c4:#1f2a44;
  --glow-c1:#7c3aed; --glow-c2:#2563eb;
  --panel:rgba(30,36,56,0.5); --card:rgba(40,48,72,0.55);
  --glass-border:rgba(255,255,255,0.14); --line:rgba(255,255,255,0.1);
  --accent:#60a5fa; --accent2:#a78bfa; --muted:rgba(220,228,240,0.62);
  --text:rgba(235,240,250,0.92); --input-bg:rgba(255,255,255,0.08);
  --table-bg:rgba(30,36,56,0.6); --success:#34d399; --danger:#f87171;
  --shadow:0 20px 50px rgba(0,0,0,0.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:"微软雅黑","Segoe UI",Arial,sans-serif;background:linear-gradient(var(--bg-angle,135deg),var(--bg-c1) 0%,var(--bg-c2) 38%,var(--bg-c3) 70%,var(--bg-c4) 100%);background-attachment:fixed;color:var(--text)}
/* 动态光斑：与 ERP body::before/::after 一致，跟随界面外观的光斑开关与浓度 */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--glow-opacity,0.55);pointer-events:none;z-index:-1;transition:opacity .3s ease}
body.no-glow::before,body.no-glow::after{display:none}
body::before{width:520px;height:520px;top:-120px;right:-80px;background:var(--glow-c1)}
body::after{width:640px;height:640px;bottom:-180px;left:-120px;background:var(--glow-c2)}
header{background:rgba(255,255,255,0.22);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-bottom:1px solid var(--glass-border);padding:16px;text-align:center;box-shadow:var(--shadow)}
html.dark header{background:rgba(30,36,56,0.5)}
header h1{margin:0;font-size:18px}
.privacy-tip{margin-top:8px;font-size:12px;color:var(--accent);background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.28);display:inline-block;padding:4px 12px;border-radius:20px}
.topbar{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:0 6px 16px rgba(59,130,246,0.26)}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:rgba(231,76,60,0.15);color:var(--danger);border:1px solid rgba(231,76,60,0.35)}
.container{max-width:1180px;margin:16px auto;padding:12px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.tab{padding:10px 14px;border-radius:10px;background:var(--card);cursor:pointer;color:var(--text);border:1px solid transparent}
.tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:800}
.module{display:none;padding:8px;border-radius:8px}
.module.active{display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
input[type="number"], input[type="text"], select{padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--input-bg);color:var(--text);outline:none}
input[type="number"]:focus, input[type="text"]:focus, select:focus{border-color:var(--accent)}
/* box grid: 3 columns max */
.box-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media(max-width:1024px){.box-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.box-grid{grid-template-columns:repeat(1,1fr)}}
.box-card{background:var(--card);padding:10px;border-radius:12px;border:1px solid var(--glass-border);display:flex;gap:10px;align-items:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.box-title{min-width:60px;font-weight:800;color:var(--accent)}
.box-inputs{display:flex;gap:8px;align-items:center;flex-wrap: nowrap}
.box-inputs input{width:65px;padding:6px;border-radius:6px}
.box-actions{margin-left:auto;display:flex;gap:6px}
.remove-btn{background:transparent;border:1px solid var(--line);color:var(--text);padding:6px;border-radius:6px;cursor:pointer}
#results{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);white-space:pre-wrap;font-family:monospace;border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.chart-wrap{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.chart-card{flex:1;min-width:250px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.chart-card canvas{width:100% !important;height:260px !important;display:block}
.status{margin-top:8px;padding:8px;border-radius:6px}
.status.success{background:rgba(39,174,96,0.12);color:var(--success)}
.status.error{background:rgba(231,76,60,0.12);color:var(--danger)}
.download-list a{display:block;color:var(--accent);margin:6px 0;text-decoration:none}
.small{font-size:13px;color:var(--muted)}
.section-title{text-align:center;color:var(--accent);margin:6px 0 12px 0}
/* 装箱单预览表格 */
.table-preview{max-height:300px;overflow:auto;border:1px solid var(--line);margin-bottom:10px;border-radius:6px}
.table-preview table{border-collapse:collapse;background:var(--table-bg);width:100%;font-size:12px}
.table-preview th,.table-preview td{border:1px solid var(--line);padding:4px 6px;white-space:nowrap;color:var(--text)}
.table-preview th{background:rgba(59,130,246,0.14);color:var(--accent);position:sticky;top:0}
/* small screen tweaks */
@media(max-width:420px){ .box-inputs input{width:72px} .btn{padding:8px 10px} }

</style>
<script>
  // 主题桥接：与 ERP「界面外观」完全一致。
  // 嵌入 Tools 页时宿主通过 postMessage(cb-appearance) 推送实时外观快照（背景配色/渐变方向/光斑/明暗/强调色）；
  // 独立打开时按 localStorage(cb_appearance / cb_dark_mode) 自行还原同一套外观。
  (function () {
    function colorsAreDark(arr) {
      var valid = (arr || []).filter(function (c) { return !!c })
      if (!valid.length) return false
      var lum = function (hex) {
        try {
          var h = String(hex).trim().replace(/^#/, '')
          if (h.length === 3) h = h.split('').map(function (c) { return c + c }).join('')
          if (h.length !== 6) return 0.5
          var r = parseInt(h.slice(0, 2), 16) / 255
          var g = parseInt(h.slice(2, 4), 16) / 255
          var b = parseInt(h.slice(4, 6), 16) / 255
          var lin = function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4) }
          return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b)
        } catch (e) { return 0.5 }
      }
      var sum = 0
      for (var i = 0; i < valid.length; i++) sum += lum(valid[i])
      return sum / valid.length < 0.34
    }

    // 把宿主外观快照应用到当前文档：覆盖 CSS 变量 / dark / no-glow
    function applySnapshot(s) {
      if (!s) return
      var h = document.documentElement
      var st = h.style
      h.classList.toggle('dark', !!s.dark)
      h.classList.toggle('no-glow', !!s.noGlow)
      if (s.bg && s.bg.length >= 4 && s.bg[0]) {
        st.setProperty('--bg-c1', s.bg[0])
        st.setProperty('--bg-c2', s.bg[1])
        st.setProperty('--bg-c3', s.bg[2])
        st.setProperty('--bg-c4', s.bg[3])
      }
      if (s.glow && s.glow.length >= 2 && s.glow[0]) {
        st.setProperty('--glow-c1', s.glow[0])
        st.setProperty('--glow-c2', s.glow[1])
      }
      if (s.angle) st.setProperty('--bg-angle', s.angle)
      if (s.glowOpacity) st.setProperty('--glow-opacity', s.glowOpacity)
      if (s.accent) st.setProperty('--accent', s.accent)
    }

    // 独立打开时按 ERP localStorage 还原同一外观
    function readLocalSnapshot() {
      var app = null
      var manualDark = false
      try { app = JSON.parse(localStorage.getItem('cb_appearance') || 'null') } catch (e) {}
      try { manualDark = localStorage.getItem('cb_dark_mode') === '1' } catch (e) {}
      var snap = { dark: !!manualDark, bg: null, glow: null, angle: '', glowOpacity: '', noGlow: false, accent: '' }
      if (app) {
        if (typeof app.accent === 'string' && app.accent) snap.accent = app.accent
        if (app.glowEnabled === false) snap.noGlow = true
        if (typeof app.glowOpacity === 'number') snap.glowOpacity = String(app.glowOpacity / 100)
        if (Array.isArray(app.colors) && app.colors.length >= 2) {
          var colors = app.colors.slice(0, 4)
          // 手动深色开启且配色本身偏浅（对齐宿主行为：回退暗色默认底，避免浅底浅字）
          if (!(manualDark && !colorsAreDark(colors))) {
            snap.bg = colors
            if (Array.isArray(app.glow) && app.glow.length >= 2) snap.glow = app.glow.slice(0, 2)
            if (typeof app.angle === 'number') snap.angle = app.angle + 'deg'
            snap.dark = manualDark || colorsAreDark(colors)
          }
        }
      }
      return snap
    }

    try { applySnapshot(readLocalSnapshot()) } catch (e) {}
    window.addEventListener('message', function (e) {
      var d = e && e.data
      if (!d) return
      if (d.type === 'cb-appearance') applySnapshot(d)
      else if (d.type === 'cb-theme' && typeof d.dark === 'boolean') applySnapshot({ dark: d.dark })
    })
  })()
</script>
</head>
<body>
<header>
  <h1>空海运 &amp; 装箱单 计算工具</h1>
  <div class="privacy-tip">隐私模式：数据只在当前页面内存中处理，不写入浏览器、不上传服务器，关闭页面后自动清除</div>
  <div class="topbar">
    <button class="btn" id="copyAllBtn" title="复制当前结果到剪贴板">复制结果</button>
    <button class="btn" id="exportPdfBtn" title="导出 PDF 报表">导出 PDF</button>
    <button class="btn danger" id="clearBtn" title="清空所有输入与结果">清空全部</button>
  </div>
</header>

<div class="container">
  <div class="tabs" role="tablist">
    <div class="tab active" id="tabAirSea" onclick="showModule('airSea')">空海运计算</div>
    <div class="tab" id="tabPacking" onclick="showModule('packing')">装箱单计算</div>
  </div>

  <!-- Air/Sea module -->
  <div id="airSea" class="module active" role="region" aria-labelledby="tabAirSea">
    <h2 class="section-title">空运 &amp; 海运 多箱计算</h2>

    <div class="controls">
      <button class="btn" onclick="addBoxes(1)">添加箱子</button>
      <label>空运单价 (¥/kg)
        <input id="airRate" type="number" step="any" value="85" />
      </label>
      <label>体积重除数
        <select id="volDiv"><option value="6000">6000</option><option value="5000">5000</option></select>
      </label>
      <label>海运单价 (¥/m³)
        <input id="seaRate" type="number" step="any" value="3400" />
      </label>
      <button class="btn" onclick="onCalculateAir()">计算空运</button>
      <button class="btn" onclick="onCalculateSea()">计算海运</button>
    </div>

    <div class="controls">
      <button class="btn secondary" onclick="exportDataExcel()">导出 Excel（数据+结果）</button>
      <button class="btn secondary" onclick="document.getElementById('importFile').click()">导入 Excel</button>
      <button class="btn secondary" onclick="downloadTemplate()">下载模板</button>
      <input id="importFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="handleImport(event)" />
    </div>

    <div class="small">提示：在重量输入框按回车可自动添加新箱子；添加或编辑箱子时不弹提示，只有在点击“计算”时统一校验。所有数据仅保留在当前页面，刷新或关闭即清除。</div>

    <div class="box-grid" id="boxesContainer" aria-live="polite"></div>

    <div id="results" aria-live="polite">（结果会显示在这里）</div>

    <div class="chart-wrap">
      <div class="chart-card">
        <strong>箱子重量分布 (kg)</strong>
        <canvas id="weightChart"></canvas>
      </div>
      <div class="chart-card">
        <strong>箱子体积分布 (m³)</strong>
        <canvas id="volChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Packing module -->
  <div id="packing" class="module" role="region" style="display:none">
    <h2 class="section-title">装箱单价格计算（自动识别表头）</h2>

    <div class="controls">
      <label>装箱单文件（可多选）
        <input id="packingFile" type="file" accept=".xls,.xlsx" multiple />
      </label>
      <label>价格表文件
        <input id="priceFile" type="file" accept=".xls,.xlsx" />
      </label>
      <label>汇率（CNY/USD）
        <input id="exchangeRate" type="number" value="7.2" step="0.0001" />
      </label>
      <button class="btn" id="fetchRateBtn" onclick="fetchExchangeRate()">获取实时汇率</button>
      <button class="btn" id="btnCalc" onclick="processPacking()">开始处理</button>
    </div>

    <div id="status" class="status small" style="display:none"></div>

    <div id="resultDisplay" style="margin-top:12px"></div>

    <div id="batchDownloads" class="download-list" style="margin-top:10px"></div>
  </div>
</div>

<script>
/* ============================
   应用主逻辑（隐私模式：无 localStorage / sessionStorage / cookie）
   ============================ */

/* 常量消息 */
const MSG = {
  copySuccess: '复制成功',
  copyFail: '复制失败',
  needFiles: '请先上传装箱单和价格表文件',
  processed: '处理完成',
  processFail: '处理失败: ',
  noBoxes: '请先添加并填写箱子数据',
  invalidData: '有未填写或不合法的数据，请检查所有箱子（长/宽/高/重 > 0）'
};

/* DOM 引用 */
const boxesContainer = document.getElementById('boxesContainer');
const resultsEl = document.getElementById('results');
const weightCanvas = document.getElementById('weightChart');
const volCanvas = document.getElementById('volChart');
const copyAllBtn = document.getElementById('copyAllBtn');
const exportPdfBtn = document.getElementById('exportPdfBtn');
const clearBtn = document.getElementById('clearBtn');
const importFile = document.getElementById('importFile');
const packingFileInput = document.getElementById('packingFile');
const priceFileInput = document.getElementById('priceFile');
const batchDownloads = document.getElementById('batchDownloads');
const statusEl = document.getElementById('status');

let boxCount = 0;
let lastCalculation = null;
let weightChart = null;
let volChart = null;

/* 工具函数：按指定小数位向下截断（不四舍五入） */
function truncate(num, decimals){
  if(typeof num !== 'number' || !isFinite(num)) return num;
  const factor = Math.pow(10, decimals === undefined ? 2 : decimals);
  return Math.floor(num * factor) / factor;
}

/* 模块切换（仅内存态，不持久化） */
function showModule(id){
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'airSea') document.getElementById('tabAirSea').classList.add('active');
  else document.getElementById('tabPacking').classList.add('active');
}

/* 箱子卡片创建 */
function createBoxCard(data){
  boxCount++;
  const id = 'box_' + boxCount;
  const card = document.createElement('div');
  card.className = 'box-card';
  card.id = id;
  card.innerHTML =
    '<div class="box-title">箱 ' + boxCount + '</div>' +
    '<div class="box-inputs">' +
      '<div><input inputmode="decimal" name="length" type="number" step="any" placeholder="长 (cm)"></div>' +
      '<div><input inputmode="decimal" name="width" type="number" step="any" placeholder="宽 (cm)"></div>' +
      '<div><input inputmode="decimal" name="height" type="number" step="any" placeholder="高 (cm)"></div>' +
      '<div><input inputmode="decimal" name="weight" type="number" step="any" placeholder="重 (kg)"></div>' +
    '</div>' +
    '<div class="box-actions">' +
      '<button class="remove-btn" title="删除" onclick="removeBox(\'' + id + '\')">✖</button>' +
    '</div>';

  if(data && typeof data === 'object'){
    ['length','width','height','weight'].forEach(k => {
      if(data[k] !== undefined && data[k] !== null){
        const inp = card.querySelector('input[name="' + k + '"]');
        if(inp) inp.value = data[k];
      }
    });
  }

  /* 输入即时标红非法值 */
  card.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if(isNaN(v) || v <= 0) inp.style.boxShadow = '0 0 0 3px rgba(231,76,60,0.12)';
      else inp.style.boxShadow = 'none';
    });
  });

  /* 重量输入回车快速添加下一箱 */
  const weightInput = card.querySelector('input[name="weight"]');
  weightInput.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter'){
      const v = parseFloat(ev.target.value);
      if(!isNaN(v) && v > 0){
        addBoxes(1);
        setTimeout(() => {
          const last = boxesContainer.lastElementChild;
          if(last){
            const focusInput = last.querySelector('input[name="length"]');
            if(focusInput){ focusInput.focus(); try{ focusInput.select(); }catch(e){} }
          }
        }, 60);
      }
    }
  });
  return card;
}

/* 添加 / 删除箱子 */
function addBoxes(n){
  for(let i = 0; i < n; i++){
    boxesContainer.appendChild(createBoxCard());
  }
}
function removeBox(id){
  const el = document.getElementById(id);
  if(el) el.remove();
  const cards = document.querySelectorAll('.box-card');
  let seq = 1;
  cards.forEach(c => { c.querySelector('.box-title').textContent = '箱 ' + seq; seq++; });
  boxCount = cards.length;
  if(boxCount === 0) addBoxes(1); // 至少保留一箱
}

/* 清空全部（内存态重置） */
function resetAll(){
  if(!confirm('确定清空所有箱子数据、参数与结果吗？清空后无法恢复。')) return;
  boxesContainer.innerHTML = '';
  boxCount = 0;
  addBoxes(1);
  resultsEl.textContent = '（结果会显示在这里）';
  lastCalculation = null;
  ['airRate','seaRate'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = (id === 'airRate') ? '85' : '3400';
  });
  if(document.getElementById('volDiv')) document.getElementById('volDiv').value = '6000';
  if(document.getElementById('exchangeRate')) document.getElementById('exchangeRate').value = '7.2';
  if(document.getElementById('resultDisplay')) document.getElementById('resultDisplay').innerHTML = '';
  if(batchDownloads) batchDownloads.innerHTML = '';
  if(statusEl){ statusEl.style.display = 'none'; statusEl.className = 'status small'; }
  try{ if(weightChart){ weightChart.destroy(); weightChart = null; } }catch(e){}
  try{ if(volChart){ volChart.destroy(); volChart = null; } }catch(e){}
}
clearBtn.addEventListener('click', resetAll);

/* 读取全部箱子（不校验） */
function readBoxes(){
  const arr = [];
  document.querySelectorAll('.box-card').forEach(c => {
    arr.push({
      length: parseFloat(c.querySelector('input[name="length"]').value),
      width:  parseFloat(c.querySelector('input[name="width"]').value),
      height: parseFloat(c.querySelector('input[name="height"]').value),
      weight: parseFloat(c.querySelector('input[name="weight"]').value)
    });
  });
  return arr;
}

/* 校验箱子（计算时调用） */
function validateBoxes(boxes){
  if(!boxes || boxes.length === 0) return { ok:false, msg: MSG.noBoxes };
  for(let i = 0; i < boxes.length; i++){
    const b = boxes[i];
    if(!isFinite(b.length) || b.length <= 0 ||
       !isFinite(b.width)  || b.width  <= 0 ||
       !isFinite(b.height) || b.height <= 0 ||
       !isFinite(b.weight) || b.weight <= 0){
      return { ok:false, msg: MSG.invalidData };
    }
  }
  return { ok:true };
}

/* 图表更新 */
function updateCharts(boxes){
  const labels = boxes.map((b,i) => '箱 ' + (i+1));
  const weights = boxes.map(b => Number((b.weight || 0).toFixed(2)));
  const vols = boxes.map(b => Number((((b.length||0)*(b.width||0)*(b.height||0))/1e6 || 0).toFixed(4)));
  try{ if(weightChart) weightChart.destroy(); }catch(e){}
  try{ if(volChart) volChart.destroy(); }catch(e){}
  weightChart = new Chart(weightCanvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'重量(kg)', data:weights, backgroundColor:'rgba(31,182,255,0.85)' }] },
    options:{ maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } } }
  });
  volChart = new Chart(volCanvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'体积(m³)', data:vols, backgroundColor:'rgba(39,174,96,0.85)' }] },
    options:{ maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } } }
  });
}

/* 计算空运：体积重 = (长+2)*(宽+2)*(高+2)/除数，计费重取体积重与实重较大值 */
function onCalculateAir(){
  const boxes = readBoxes();
  const v = validateBoxes(boxes);
  if(!v.ok){ alert(v.msg); return; }
  const airRate = parseFloat(document.getElementById('airRate').value) || 0;
  const volDiv  = parseFloat(document.getElementById('volDiv').value) || 6000;

  let totalCost = 0, totalChargeWeight = 0;
  let out = '空运计算结果（共 ' + boxes.length + ' 箱）\n\n';

  boxes.forEach((b, i) => {
    const volWeight  = ((b.length + 2) * (b.width + 2) * (b.height + 2)) / volDiv;
    const chargeWeight = volWeight > b.weight ? volWeight : b.weight;
    const isThrown = volWeight > b.weight;
    const cost = chargeWeight * airRate;
    const actualVolume = (b.length * b.width * b.height) / 1000000;
    totalCost += cost;
    totalChargeWeight += chargeWeight;

    out += '【箱 ' + (i+1) + '】\n';
    out += '  实重: ' + b.weight + ' kg\n';
    out += '  体积重(单边+2): ' + truncate(volWeight, 2) + ' kg\n';
    out += '  实际体积: ' + truncate(actualVolume, 4) + ' m³\n';
    out += '  类型: ' + (isThrown ? '抛货 ▲' : '重货 ▼') + '\n';
    out += '  计费重: ' + truncate(chargeWeight, 2) + ' kg\n';
    out += '  运费: ¥' + truncate(cost, 2) + '\n\n';
  });

  out += '汇总\n';
  out += '总箱数: ' + boxes.length + ' 箱\n';
  out += '总计空运计费重量: ' + truncate(totalChargeWeight, 2) + ' kg\n';
  out += '总成本: ¥' + truncate(totalCost, 2) + ' 元';

  resultsEl.textContent = out;
  lastCalculation = { type:'air', data:out };
  updateCharts(boxes);
}

/* 计算海运：按原始体积 / +1cm / +1.5cm 三档 */
function onCalculateSea(){
  const boxes = readBoxes();
  const v = validateBoxes(boxes);
  if(!v.ok){ alert(v.msg); return; }
  const seaRate = parseFloat(document.getElementById('seaRate').value) || 0;

  let totalVol = 0, totalWeight = 0;
  let totalVol1cm = 0, totalVol15cm = 0;

  const boxDetails = boxes.map(b => {
    const originalVol = (b.length * b.width * b.height) / 1e6;
    const vol1cm   = ((b.length + 1) * (b.width + 1) * (b.height + 1)) / 1e6;
    const vol15cm  = ((b.length + 1.5) * (b.width + 1.5) * (b.height + 1.5)) / 1e6;
    totalVol += originalVol;
    totalWeight += b.weight;
    totalVol1cm += vol1cm;
    totalVol15cm += vol15cm;
    return { originalVol, vol1cm, vol15cm, weight:b.weight };
  });

  const diff1cm  = totalVol1cm - totalVol;
  const diff15cm = totalVol15cm - totalVol;
  const costOriginal = totalVol * seaRate;
  const cost1cm = totalVol1cm * seaRate;
  const cost15cm = totalVol15cm * seaRate;

  let boxInfoText = '每箱体积详情（共 ' + boxes.length + ' 箱）:\n';
  boxDetails.forEach((box, idx) => {
    boxInfoText +=
      '箱 ' + (idx+1) + ': ' + truncate(box.originalVol, 3) + 'm³ (原) | ' +
      truncate(box.vol1cm, 3) + 'm³ (+1cm) | ' +
      truncate(box.vol15cm, 3) + 'm³ (+1.5cm)\n';
  });

  const out =
    '海运计算结果\n\n' +
    boxInfoText + '\n' +
    '汇总数据:\n' +
    '总箱数:       ' + boxes.length + ' 箱\n' +
    '总重量:       ' + truncate(totalWeight, 4) + ' kg\n\n' +
    '原始体积:     ' + truncate(totalVol, 4) + ' m³ | 运费: ¥' + truncate(costOriginal, 4) + '\n' +
    '+1cm体积:     ' + truncate(totalVol1cm, 4) + ' m³ | 运费: ¥' + truncate(cost1cm, 4) + '\n' +
    '1cm 体积差:   +' + truncate(diff1cm, 4) + ' m³\n' +
    '+1.5cm体积:   ' + truncate(totalVol15cm, 4) + ' m³ | 运费: ¥' + truncate(cost15cm, 4) + '\n' +
    '1.5cm 体积差: +' + truncate(diff15cm, 4) + ' m³';

  resultsEl.textContent = out;
  lastCalculation = { type:'sea', data:out };
  updateCharts(boxes);
}

/* 导出 Excel：箱子明细 + 计算结果文本 */

/* 导入 Excel（箱子）：模板列 = 箱号, 重量, 长, 宽, 高 */
function handleImport(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const arr = new Uint8Array(e.target.result);
      const wb = XLSX.read(arr, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });

      boxesContainer.innerHTML = '';
      boxCount = 0;

      let imported = 0, ignored = 0;
      for(let i = 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || row.length === 0){ continue; }
        const weight = Number(row[1]);
        const length = Number(row[2]);
        const width  = Number(row[3]);
        const height = Number(row[4]);
        const hasValidData = (length > 0) || (width > 0) || (height > 0) || (weight > 0);
        if(!hasValidData){ ignored++; continue; }

        boxesContainer.appendChild(createBoxCard({
          weight: weight || '',
          length: length || '',
          width:  width  || '',
          height: height || ''
        }));
        imported++;
      }

      if(boxCount === 0) addBoxes(1);

      alert('导入完成\n\n成功导入：' + imported + ' 箱' + (ignored > 0 ? '\n已忽略空行：' + ignored + ' 行' : ''));
    }catch(err){
      console.error(err);
      alert('Excel 导入失败，请检查文件格式');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}

/* ---------- 装箱单批量计价 ---------- */
async function processPacking(){
  const packingFiles = Array.from(packingFileInput.files || []);
  const priceFile = priceFileInput.files[0];
  const exchangeRate = parseFloat(document.getElementById('exchangeRate').value) || 7.2;

  batchDownloads.innerHTML = '';
  const resultDisplay = document.getElementById('resultDisplay');
  resultDisplay.innerHTML = '';
  statusEl.style.display = 'block';
  statusEl.className = 'status small';
  statusEl.textContent = '处理中...';

  if(!packingFiles.length || !priceFile){
    statusEl.textContent = MSG.needFiles;
    statusEl.className = 'status error small';
    return;
  }
  if(!isFinite(exchangeRate) || exchangeRate <= 0){
    statusEl.textContent = '请输入有效的汇率';
    statusEl.className = 'status error small';
    return;
  }

  try{
    /* 读取价格表：识别 产品名称/名称/品名 + 单价/价格/RMB */
    const priceBuf = await priceFile.arrayBuffer();
    const priceWb = XLSX.read(priceBuf, { type:'array' });
    const priceJson = XLSX.utils.sheet_to_json(priceWb.Sheets[priceWb.SheetNames[0]], { defval:'' });
    const priceMap = new Map();
    priceJson.forEach(row => {
      const pname = row['产品名称'] || row['名称'] || row['品名'] || row['产品'];
      const pval  = row['单价'] || row['价格'] || row['RMB'] || row['人民币'];
      if(pname && pval !== undefined && pval !== ''){
        const key = String(pname).trim();
        if(key) priceMap.set(key, Number(pval));
      }
    });
    if(priceMap.size === 0){
      statusEl.textContent = '价格表中未识别到“产品名称/单价”列，请检查价格表格式';
      statusEl.className = 'status error small';
      return;
    }

    let totalFiles = 0, totalModified = 0, totalMiss = 0;

    for(let i = 0; i < packingFiles.length; i++){
      const buf = await packingFiles[i].arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const sheetName = wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, defval:'' });

      /* 定位表头行：需要同时含 货箱编号/产品名称/产品申报单价（宽松版可只含 产品名称+产品申报单价） */
      let headerRowIdx = raw.findIndex(row =>
        row.some(c => (c + '').includes('货箱编号')) &&
        row.some(c => (c + '').includes('产品名称')) &&
        row.some(c => (c + '').includes('申报单价'))
      );
      if(headerRowIdx === -1){
        headerRowIdx = raw.findIndex(row =>
          row.some(c => (c + '').includes('产品名称')) &&
          row.some(c => (c + '').includes('申报单价'))
        );
      }
      if(headerRowIdx === -1){
        resultDisplay.innerHTML += '<p style="color:#e67e22">文件 ' + packingFiles[i].name + '：未找到目标表头，已跳过</p>';
        continue;
      }

      const header = raw[headerRowIdx];
      const dataRows = raw.slice(headerRowIdx + 1);
      const idxName  = header.findIndex(c => (c + '').includes('产品名称'));
      const idxPrice = header.findIndex(c => (c + '').includes('申报单价'));
      if(idxName === -1 || idxPrice === -1){
        resultDisplay.innerHTML += '<p style="color:#e67e22">文件 ' + packingFiles[i].name + '：缺少“产品名称/申报单价”列，已跳过</p>';
        continue;
      }

      let modified = 0, miss = 0;
      dataRows.forEach(r => {
        const pname = (r[idxName] || '').toString().trim();
        if(!pname) return;
        const unitRMB = priceMap.get(pname);
        if(unitRMB !== undefined){
          const declaredUSD = unitRMB / exchangeRate * 1.2;
          r[idxPrice] = parseFloat(declaredUSD.toFixed(2));
          modified++;
        } else {
          miss++;
        }
      });

      wb.Sheets[sheetName] = XLSX.utils.aoa_to_sheet([header, ...dataRows]);

      const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      const blob = new Blob([out], { type:'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '装箱单_已计算_' + (i + 1) + '.xlsx';
      a.textContent = '下载：' + packingFiles[i].name + '（已处理 ' + modified + ' 条）';
      batchDownloads.appendChild(a);

      const tableHTML = XLSX.utils.sheet_to_html(wb.Sheets[sheetName], { editable:false })
        .replace(/<script[\s\S]*?<\/script>/gi, '');
      resultDisplay.innerHTML +=
        '<h4 style="margin:8px 0 4px">文件：' + packingFiles[i].name +
        '（修改 ' + modified + ' 条' + (miss ? '，未匹配 ' + miss + ' 条' : '') + '）</h4>' +
        '<div class="table-preview">' + tableHTML + '</div>';

      totalFiles++; totalModified += modified; totalMiss += miss;
    }

    statusEl.textContent =
      '处理完成：' + totalFiles + ' 个文件，共修改 ' + totalModified + ' 条' +
      (totalMiss ? '，未匹配 ' + totalMiss + ' 条（请核对价格表产品名称）' : '');
    statusEl.className = 'status success small';
  }catch(err){
    console.error(err);
    statusEl.textContent = MSG.processFail + (err.message || err);
    statusEl.className = 'status error small';
  }
}

/* 实时汇率（多源轮询，只读取公开汇率，不发送任何业务数据） */
async function fetchExchangeRate(){
  const sources = [
    { name:'frankfurter', url:'https://api.frankfurter.app/latest?from=CNY&to=USD',
      parse: j => j && j.rates && j.rates.USD ? j.rates.USD : null },
    { name:'open.er-api', url:'https://open.er-api.com/v6/latest/CNY',
      parse: j => j && j.rates && j.rates.USD ? j.rates.USD : null },
    { name:'exchangerate.host', url:'https://api.exchangerate.host/latest?base=CNY&symbols=USD',
      parse: j => j && j.rates && j.rates.USD ? j.rates.USD : null }
  ];
  statusEl.style.display = 'block';
  statusEl.className = 'status small';
  statusEl.textContent = '获取汇率中...';

  for(const src of sources){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(src.url, { signal: ctrl.signal });
      clearTimeout(timer);
      if(!r.ok) continue;
      const j = await r.json();
      const cnyPerUsd = src.parse(j);
      if(cnyPerUsd && isFinite(cnyPerUsd) && cnyPerUsd > 0){
        const rate = 1 / cnyPerUsd;
        document.getElementById('exchangeRate').value = parseFloat(rate.toFixed(4));
        statusEl.textContent = '汇率更新成功（' + src.name + '），当前 CNY/USD = ' + parseFloat(rate.toFixed(4));
        statusEl.className = 'status success small';
        return;
      }
    }catch(e){
      /* 尝试下一个源 */
    }
  }
  statusEl.textContent = '获取汇率失败，请手动输入';
  statusEl.className = 'status error small';
}

/* 导出 PDF（html2canvas 快照文字与图表后生成 PDF） */
exportPdfBtn.addEventListener('click', async () => {
  try{
    if(!resultsEl.textContent || resultsEl.textContent.startsWith('（')){
      alert('请先计算，再导出 PDF'); return;
    }
    const tmp = document.createElement('div');
    tmp.style.position = 'fixed'; tmp.style.left = '-10000px'; tmp.style.top = '0';
    tmp.style.background = '#fff'; tmp.style.color = '#000';
    tmp.style.padding = '20px'; tmp.style.width = '1000px'; tmp.style.boxSizing = 'border-box';
    const title = document.createElement('h2'); title.textContent = '空海运计算报告'; tmp.appendChild(title);
    const ts = document.createElement('div'); ts.textContent = '时间: ' + new Date().toLocaleString(); tmp.appendChild(ts);
    const resBlock = document.createElement('pre');
    resBlock.style.whiteSpace = 'pre-wrap'; resBlock.style.fontFamily = 'monospace'; resBlock.style.marginTop = '12px';
    resBlock.textContent = resultsEl.textContent || '';
    tmp.appendChild(resBlock);

    const chartsWrap = document.createElement('div');
    chartsWrap.style.display = 'flex'; chartsWrap.style.gap = '12px'; chartsWrap.style.marginTop = '12px';
    const imgList = [];
    if(weightChart){
      const img1 = new Image();
      img1.src = weightChart.toBase64Image();
      img1.style.width = '460px'; img1.style.height = '260px';
      chartsWrap.appendChild(img1); imgList.push(img1);
    }
    if(volChart){
      const img2 = new Image();
      img2.src = volChart.toBase64Image();
      img2.style.width = '460px'; img2.style.height = '260px';
      chartsWrap.appendChild(img2); imgList.push(img2);
    }
    tmp.appendChild(chartsWrap);
    document.body.appendChild(tmp);

    /* 确保图表图片解码完成 */
    await Promise.all(imgList.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()));

    const canvas = await html2canvas(tmp, { scale: 2, useCORS: true });
    document.body.removeChild(tmp);
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 20;
    const imgW = pageWidth - margin * 2;
    const imgH = canvas.height * (imgW / canvas.width);
    /* 超长内容自动分页 */
    let remainH = imgH;
    let offsetY = margin;
    pdf.addImage(imgData, 'PNG', margin, offsetY, imgW, Math.min(imgH, pageHeight - margin * 2));
    pdf.save('空海运计算报告_' + new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + '.pdf');
    alert('PDF 已生成');
  }catch(err){
    console.error(err);
    alert('导出 PDF 失败: ' + (err.message || err));
  }
});
