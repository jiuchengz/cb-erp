<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 图片压缩瘦身工具</title>
<!-- 本地解压/打包依赖 JSZip（首次使用需联网加载，加载成功后即可离线重复使用） -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
if (typeof JSZip === 'undefined') {
  document.write('<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"><\/script>');
}
if (typeof JSZip === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>');
}
</script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6fa;
    color: #2f3542;
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #747d8c; font-size: 13px; margin-bottom: 18px; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .dropzone {
    border: 2px dashed #a4b0be;
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    color: #747d8c;
    cursor: pointer;
    transition: all .2s;
  }
  .dropzone.dragover { border-color: #1e90ff; background: #f0f8ff; color: #1e90ff; }
  .dropzone input { display: none; }
  .dropzone strong { color: #1e90ff; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin: 14px 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: #57606f; }
  .field input[type=number], .field select {
    border: 1px solid #ced6e0; border-radius: 6px; padding: 8px 10px; width: 160px; font-size: 14px;
  }
  .field input[type=range] { width: 260px; }
  .hint { font-size: 12px; color: #a4b0be; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #57606f; margin-top: 10px; }
  .btn {
    background: #1e90ff; color: #fff; border: none; border-radius: 6px;
    padding: 10px 22px; font-size: 15px; cursor: pointer; margin-right: 8px;
  }
  .btn:disabled { background: #a4b0be; cursor: not-allowed; }
  .btn.gray { background: #dfe4ea; color: #57606f; }
  .status { margin-top: 12px; font-size: 14px; color: #57606f; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { border-bottom: 1px solid #f1f2f6; padding: 8px 6px; text-align: left; }
  th { color: #747d8c; font-weight: 600; background: #fafbfc; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .save { color: #2ed573; font-weight: 600; }
  .big { font-size: 18px; font-weight: 700; }
  .percent { color: #2ed573; }
  .warn { background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
  .badge { display: inline-block; background: #eef4ff; color: #1e90ff; border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-left: 6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Excel 图片压缩瘦身工具</h1>
  <div class="sub">纯本地处理：文件不会上传到任何服务器，请放心使用。支持 .xlsx / .xlsm</div>

  <div class="card">
    <div class="dropzone" id="dropzone">
      点击选择或拖拽 Excel 文件到此处<br><span style="font-size:12px">仅支持 .xlsx / .xlsm（图片嵌入在表格内部的格式）</span>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm">
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>压缩目标（可选，设为 0 表示不限制）</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" id="targetSize" min="0" step="0.1" value="0" placeholder="例如 2" style="width:120px;border:1px solid #ced6e0;border-radius:6px;padding:8px 10px;font-size:14px;">
          <select id="targetUnit" style="border:1px solid #ced6e0;border-radius:6px;padding:8px 6px;font-size:14px;">
            <option value="MB" selected>MB</option>
            <option value="KB">KB</option>
          </select>
        </div>
        <span class="hint">工具会尽量逼近该大小，但图片本身极小时无法强制放大</span>
      </div>
      <div class="field">
        <label>图片质量（JPEG 照片/图表）</label>
        <input type="range" id="quality" min="10" max="100" value="70">
        <span class="hint">当前：<span id="qualityVal">70</span>%（越低压缩越狠）</span>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>最长边限制（像素，可选）</label>
        <select id="maxDim">
          <option value="0">不限制</option>
          <option value="4096">4096（4K）</option>
          <option value="2560">2560</option>
          <option value="1920">1920</option>
          <option value="1280">1280</option>
          <option value="1024">1024</option>
          <option value="800">800</option>
        </select>
        <span class="hint">超过该尺寸的图片会被等比缩小</span>
      </div>
      <div class="field">
        <label>允许自动降级</label>
        <select id="autoDegrade">
          <option value="1">自动：目标未达标时持续降质/缩小</option>
          <option value="0">固定参数：只按上面的参数压一次</option>
        </select>
        <span class="hint">推荐开启，压到更接近目标大小</span>
      </div>
    </div>
    <div class="chk">
      <input type="checkbox" id="keepSmaller" checked>
      <label for="keepSmaller">某张图压缩后反而变大时，保留原图（推荐勾选）</label>
    </div>
    <div style="margin-top:16px">
      <button class="btn" id="startBtn" disabled>开始压缩</button>
      <button class="btn gray" id="downloadBtn" disabled>下载压缩后的 Excel</button>
      <button class="btn gray" id="resetBtn">重新选择文件</button>
    </div>
    <div class="status" id="status"></div>
    <div class="warn" id="warn" style="display:none"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2 style="font-size:16px;margin:0 0 4px">压缩结果</h2>
    <table>
      <tr><th>指标</th><th style="text-align:right">数值</th></tr>
      <tr><td>原始文件大小</td><td class="num" id="rOrig"></td></tr>
      <tr><td>压缩后文件大小</td><td class="num" id="rNew"></td></tr>
      <tr><td>节省空间</td><td class="num" id="rSave"></td></tr>
      <tr><td>图片数量</td><td class="num" id="rImg"></td></tr>
      <tr><td>是否达到目标大小</td><td class="num" id="rHit"></td></tr>
    </table>
    <div class="sub" style="margin-top:10px" id="detailText"></div>
  </div>
</div>

</body>
</html>
